<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Scent Finder · CN1 Fragrance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --coral: #ef4932;
        --coral-deep: #d63a22;
        --ink: #1a1009;
        --muted: #6b5c52;
        --cream: #fffcfa;
        --line: rgba(26, 16, 9, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: "Outfit", system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(ellipse 1100px 700px at 8% -10%, rgba(239, 73, 50, 0.16), transparent 55%),
          radial-gradient(ellipse 900px 600px at 100% 0%, rgba(245, 158, 11, 0.12), transparent 50%),
          radial-gradient(ellipse 700px 500px at 50% 110%, rgba(251, 113, 60, 0.1), transparent 55%),
          linear-gradient(165deg, #fffcfa 0%, #fff7f3 48%, #fffaf7 100%);
        overflow-x: hidden;
      }

      .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(40px);
        pointer-events: none;
        z-index: 0;
        animation: float 12s ease-in-out infinite;
      }

      .orb-a {
        width: 280px;
        height: 280px;
        top: 12%;
        left: -60px;
        background: rgba(239, 73, 50, 0.18);
      }

      .orb-b {
        width: 220px;
        height: 220px;
        right: -40px;
        bottom: 18%;
        background: rgba(245, 158, 11, 0.16);
        animation-delay: -4s;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-18px) scale(1.04);
        }
      }

      .shell {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 40px 20px;
      }

      .card {
        width: min(100%, 720px);
        text-align: center;
        padding: 56px 40px 48px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.8);
        box-shadow:
          0 30px 80px rgba(26, 16, 9, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(18px);
        animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(24px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 22px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: rgba(239, 73, 50, 0.08);
        border: 1px solid rgba(239, 73, 50, 0.16);
        animation: pulse 2.8s ease-in-out infinite;
      }

      .mark svg {
        width: 34px;
        height: 34px;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }

      .eyebrow {
        margin: 0 0 14px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--coral);
      }

      h1 {
        margin: 0 0 16px;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: clamp(2.4rem, 6vw, 3.6rem);
        font-weight: 500;
        line-height: 1.05;
        letter-spacing: -0.02em;
      }

      h1 em {
        font-style: italic;
        color: var(--coral-deep);
      }

      .lead {
        margin: 0 auto 28px;
        max-width: 34rem;
        font-size: 1.05rem;
        font-weight: 300;
        line-height: 1.65;
        color: var(--muted);
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.92rem;
        font-weight: 500;
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #d1d5db;
        box-shadow: 0 0 0 4px rgba(209, 213, 219, 0.25);
      }

      .dot.ok {
        background: #22c55e;
        box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.18);
      }

      .dot.err {
        background: var(--coral);
        box-shadow: 0 0 0 4px rgba(239, 73, 50, 0.16);
      }

      .footer {
        margin-top: 34px;
        font-size: 0.85rem;
        color: rgba(107, 92, 82, 0.8);
        letter-spacing: 0.04em;
      }

      @media (max-width: 640px) {
        .card {
          padding: 42px 22px 36px;
          border-radius: 22px;
        }
      }
    </style>
  </head>
  <body>
    <span class="orb orb-a" aria-hidden="true"></span>
    <span class="orb orb-b" aria-hidden="true"></span>

    <div class="shell">
      <main class="card">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M20 5C20.8 13.7 26.3 19.2 35 20C26.3 20.8 20.8 26.3 20 35C19.2 26.3 13.7 20.8 5 20C13.7 19.2 19.2 13.7 20 5Z"
              stroke="#EF4932"
              stroke-width="1.8"
            />
          </svg>
        </div>

        <p class="eyebrow">CN1 Fragrance</p>
        <h1>AI Scent Finder<br /><em>is ready</em></h1>
        <p class="lead">
          Your fragrance concierge is live — helping shoppers discover the perfect scent
          with warm, personal recommendations from the CN1 collection.
        </p>

        <div class="pill" aria-live="polite">
          <span class="dot" id="dot"></span>
          <span id="label">Checking service…</span>
        </div>

        <p class="footer">Powered by the CN1 AI Fragrance Concierge</p>
      </main>
    </div>

    <script>
      (async function () {
        const dot = document.getElementById("dot");
        const label = document.getElementById("label");
        try {
          const res = await fetch("/api/recommend", {
            headers: { Accept: "application/json" },
          });
          const data = await res.json();
          const ok = res.ok && data && data.ok;
          dot.className = "dot " + (ok ? "ok" : "err");
          label.textContent = ok ? "Service online" : "Service unavailable";
        } catch (err) {
          dot.className = "dot err";
          label.textContent = "Service unavailable";
        }
      })();
    </script>
  </body>
</html>
